[project]
name = "server"
version = "0.1.0"
description = ""
authors = [
    {name = "Yannick Villanueva",email = "yannick.vill@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi (>=0.120.4,<0.121.0)",
    "pydantic (>=2.12.3,<3.0.0)",
    "uvicorn (>=0.38.0,<0.39.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "pydantic-settings (>=2.11.0,<3.0.0)",
    "google-auth-oauthlib (>=1.2.3,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "watchfiles (>=1.1.1,<2.0.0)",
    "websockets (>=15.0.1,<16.0.0)",
]
packages = [{ include = "server" }]


[project.scripts]
server = "server.app:serve"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
python_version = "3.14"
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
pretty = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[dependency-groups]
dev = [
    "mypy (>=1.18.2,<2.0.0)",
    "types-requests (>=2.32.4.20250913,<3.0.0.0)",
    "types-pyyaml (>=6.0.12.20250915,<7.0.0.0)",
    "ruff (>=0.14.3,<0.15.0)",
    "types-aiofiles (>=25.1.0.20251011,<26.0.0.0)"
]
